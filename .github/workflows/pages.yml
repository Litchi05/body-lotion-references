name: Publish reference gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble website
        run: |
          mkdir -p _site
          cp index.html categories.json .nojekyll _site/
          for archive in media-part-*.zip; do unzip -q "$archive" -d _site; done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          groups=json.loads((root/'categories.json').read_text())
          for group in groups:
              for shot in group['shots']:
                  assert (root/'media'/(shot['name']+'.jpg')).is_file()
                  if shot['type']=='video':
                      assert (root/'media'/(shot['name']+'.mp4')).is_file()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
