<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="身体乳拍摄动态参考：16组视频、309个镜头，支持分组浏览与循环播放。"><meta name="robots" content="noindex,nofollow"><title>身体乳 · 动态参考</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f8;color:#292331;font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{padding:24px 18px 14px;max-width:920px;margin:auto}small{color:#806591;letter-spacing:2px}h1{font-size:25px;margin:5px 0}p{color:#776c80;font-size:13px;margin:6px 0}.tools{position:sticky;top:0;background:#f5f2f8f5;padding:12px 16px;z-index:2;border-bottom:1px solid #e7e0ed}select{width:100%;padding:12px;border:1px solid #d8cce2;border-radius:10px;background:white;font:inherit;color:inherit;max-width:888px;display:block;margin:auto}.bar{max-width:888px;margin:10px auto 0;display:flex;justify-content:space-between;align-items:center;font-size:14px}button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:#6c4c82;color:white;cursor:pointer}main{max-width:920px;padding:16px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}article{background:white;border-radius:12px;overflow:hidden;border:1px solid #e9e3ee}video{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#e9e3ee}article div{padding:10px;font-size:14px}b{font-size:14px}a{color:#75538e}footer{padding:20px;text-align:center;color:#83748e;font-size:12px}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}nav{display:flex;gap:8px;overflow:auto;max-width:888px;margin:auto;padding-bottom:6px}nav button{white-space:nowrap;background:white;color:#534460;border:1px solid #dbd0e3;min-height:44px}nav button.active{background:#6c4c82;color:white;border-color:#6c4c82}article img{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#e9e3ee}.source{display:block;color:#75677d;font-size:12px;overflow-wrap:anywhere;margin-top:6px}#hint{max-width:888px;margin:8px auto 0;color:#75677d;font-size:13px}</style></head><body><header><small>SHOOTING REFERENCES</small><h1>身体乳 · 动态参考</h1><p>7类拍摄参考 · 309个动态镜头 + 8张构图静帧</p><p>按拍摄顺序查看参考。照片栏为视频静帧，仅供构图参考。</p></header><div class="tools"><nav id="categories" aria-label="拍摄顺序"></nav><div class="bar"><span id="count">正在加载…</span><button id="toggle">全部暂停</button></div><p id="hint"></p></div><main><div class="grid" id="grid"></div></main><footer>画面与动作仅供拍摄参考 · 具体以现场实拍为准</footer><script>
let data=[],paused=false,active=1;const grid=document.querySelector('#grid'),nav=document.querySelector('#categories'),toggle=document.querySelector('#toggle');const observer=new IntersectionObserver(entries=>entries.forEach(e=>{const v=e.target;if(e.isIntersecting){if(!v.src){v.src=v.dataset.src;v.load()}if(!paused)v.play().catch(()=>{})}else v.pause()}),{threshold:.3});
function render(){observer.disconnect();grid.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});grid.replaceChildren();const group=data.find(g=>g.id===active)||data[0];nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',Number(b.dataset.id)===active);b.setAttribute('aria-pressed',String(Number(b.dataset.id)===active))});document.querySelector('#count').textContent=group.shots.length+(active===7?' 张构图参考':' 个动态镜头');document.querySelector('#hint').textContent=active===7?'从参考视频选取的静帧；产品主图、模特手持、质地、使用展示各2张。':active===6?'含场景、人物状态、原片口播及过渡画面，按现场需要借鉴。':active===5?'仅参考皮肤展示动作和光线，不代表本产品的实际使用效果。':'';toggle.hidden=active===7;
for(const s of group.shots){const card=document.createElement('article');let media;
if(s.type==='photo'){media=document.createElement('img');media.src='media/'+s.name+'.jpg';media.alt=s.label;media.loading='lazy'}else{media=document.createElement('video');media.muted=true;media.loop=true;media.playsInline=true;media.controls=true;media.preload='none';media.poster='media/'+s.name+'.jpg';media.dataset.src='media/'+s.name+'.mp4';media.setAttribute('playsinline','');media.setAttribute('webkit-playsinline','')}
const text=document.createElement('div'),b=document.createElement('b');b.textContent=s.type==='photo'?s.label:'镜头 '+s.name;const source=document.createElement('span');source.className='source';source.textContent=s.source;text.append(b,document.createElement('br'),document.createTextNode(s.start.toFixed(2)+'–'+s.end.toFixed(2)+'秒'),source,document.createElement('br'));const link=document.createElement('a');link.href='media/'+s.name+(s.type==='photo'?'.jpg':'.mp4');link.textContent=s.type==='photo'?'查看图片':'单独打开';link.target='_blank';link.rel='noopener';text.append(link);card.append(media,text);grid.append(card);if(s.type!=='photo')observer.observe(media)}localStorage.setItem('ref-category',active)}
toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'继续播放':'全部暂停';grid.querySelectorAll('video').forEach(v=>{if(paused)v.pause();else{const r=v.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)v.play().catch(()=>{})}})};
fetch('categories.json').then(r=>r.json()).then(d=>{data=d;for(const g of data){const b=document.createElement('button');b.dataset.id=g.id;b.textContent=String(g.id).padStart(2,'0')+' '+g.name;b.onclick=()=>{active=g.id;render();window.scrollTo(0,0)};nav.append(b)}const saved=Number(localStorage.getItem('ref-category'));active=data.some(g=>g.id===saved)?saved:1;render()}).catch(()=>document.querySelector('#count').textContent='加载失败，请刷新页面');document.addEventListener('visibilitychange',()=>{if(document.hidden)grid.querySelectorAll('video').forEach(v=>v.pause())});
</script></body></html>
